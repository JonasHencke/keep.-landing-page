seo:
  title: "Keep. — Photo Cleaner for iPhone | Declutter & Free Up Storage"
  description: "Keep. is the swipe-to-sort photo cleaner for iPhone: swipe left to delete, right to keep. Clear out screenshots and duplicates and free up storage fast."
title: "Declutter your camera roll.\nFree up storage."
description: Keep. turns photo cleanup into a single swipe — left to delete, right to keep. Work through screenshots, duplicates and blurry shots and win back gigabytes on your iPhone in minutes.
hero:
  headline: "Keep. — Photo Cleaner for iPhone"
  image:
    src: /images/keep-photo-cleaner-app-880.webp
    srcset: "/images/keep-photo-cleaner-app-440.webp 440w, /images/keep-photo-cleaner-app-640.webp 640w, /images/keep-photo-cleaner-app-880.webp 880w, /images/keep-photo-cleaner-app-1268.webp 1268w"
    sizes: "(min-width: 1280px) 520px, (min-width: 1024px) 460px, (min-width: 640px) 420px, 320px"
    alt: Keep. photo cleaner app running on an iPhone — swipe a photo left to delete it or right to keep it
    width: 1268
    height: 1389
  links:
    - label: Download on the App Store
      icon: i-simple-icons-appstore
      color: primary
      size: xl
      to: '#'
      target: _blank
    - label: See how it works
      size: xl
      color: neutral
      variant: soft
      to: '#features'
  highlights:
    - icon: i-lucide-hand
      label: Swipe left to delete, right to keep
    - icon: i-lucide-undo-2
      label: Undo any swipe instantly
    - icon: i-lucide-folder-plus
      label: Sort keepers into albums
features:
  headline: Capabilities
  title: "Every signal, one surface."
  description: No more tab-switching between metrics, traces, and logs. Correlate everything into a single explorable topology.
  items:
    - icon: i-lucide-zap
      title: Predictive Alerts
      description: ML models trained on your baselines detect anomalies 4 minutes before they hit your SLOs.
    - icon: i-lucide-radar
      title: Topology Mapping
      description: Auto-discovers service dependencies with zero config. See how a deploy in auth-service ripples through checkout.
    - icon: i-lucide-layers
      title: Unified Telemetry
      description: "Logs, metrics, and traces in one query language. Stop context-switching. Start correlating."
    - icon: i-lucide-git-commit-horizontal
      title: Deploy Tracking
      description: Every deploy is automatically correlated with performance changes. Know which commit caused the regression.
    - icon: i-lucide-filter
      title: Smart Sampling
      description: "AI-driven sampling retains interesting traces and drops noise. Cut storage costs 10× without losing signal."
    - icon: i-lucide-notebook-pen
      title: Team Notebooks
      description: Collaborative investigation notebooks that turn incident debugging into reusable runbooks.
metrics:
  headline: By the numbers
  title: "Built for scale you haven't hit yet."
  description: Process billions of events per day across thousands of production environments with an architecture designed for the workloads of 2030.
  items:
    - value: "99.99%"
      label: Uptime SLA
      class: "text-success"
    - value: "<50ms"
      label: P99 query
      class: "text-primary"
    - value: "14B+"
      label: Events / day
      class: "text-info"
    - value: "4 min"
      label: Early warning
      class: "text-warning"
cta:
  title: "Ready to stop\nfirefighting?"
  description: Free for up to 5 services. No credit card. Deploys in under a minute.
  command: npx telemetry init
  links:
    - label: Start for free
      color: primary
      to: '#'
